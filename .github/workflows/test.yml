# Runs the tests on fake demo data on every push. Your real data/ is git-ignored, so it never reaches GitHub.
name: test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # same versions as Brian's Mac
      - run: pip install pandas==2.2.2 fastapi==0.165.0 httpx==0.27.0
      - run: ./run.sh test
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: cd web && npm ci && npm run build
